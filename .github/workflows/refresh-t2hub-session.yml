name: Refresh T2Hub session

on:
  schedule:
    # Refresh every hour so the session remains valid even when GitHub
    # delays a scheduled job. GitHub may still add a short scheduling delay.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: t2hub-session-refresh
  cancel-in-progress: false

jobs:
  refresh-session:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_T2HUB_EMAIL: ${{ secrets.T2HUB_EMAIL != '' }}
      HAS_T2HUB_PASSWORD: ${{ secrets.T2HUB_PASSWORD != '' }}
      HAS_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
      HAS_SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID != '' }}
      HAS_TAKAMOL_LIVE_API_URL: ${{ secrets.TAKAMOL_LIVE_API_URL != '' }}
      HAS_TAKAMOL_ENCRYPTION_KEY_B64: ${{ secrets.TAKAMOL_ENCRYPTION_KEY_B64 != '' }}
      HAS_TAKAMOL_SESSION_COOKIE: ${{ secrets.TAKAMOL_SESSION_COOKIE != '' }}
      HAS_TAKAMOL_XSRF_TOKEN: ${{ secrets.TAKAMOL_XSRF_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          echo "T2HUB_EMAIL present: $HAS_T2HUB_EMAIL"
          echo "T2HUB_PASSWORD present: $HAS_T2HUB_PASSWORD"
          echo "SUPABASE_ACCESS_TOKEN present: $HAS_SUPABASE_ACCESS_TOKEN"
          echo "SUPABASE_PROJECT_ID present: $HAS_SUPABASE_PROJECT_ID"
          echo "TAKAMOL_LIVE_API_URL present: $HAS_TAKAMOL_LIVE_API_URL"
          echo "TAKAMOL_ENCRYPTION_KEY_B64 present: $HAS_TAKAMOL_ENCRYPTION_KEY_B64"
          echo "TAKAMOL_SESSION_COOKIE present: $HAS_TAKAMOL_SESSION_COOKIE"
          echo "TAKAMOL_XSRF_TOKEN present: $HAS_TAKAMOL_XSRF_TOKEN"
          if [ "$HAS_T2HUB_EMAIL" != "true" ] || [ "$HAS_T2HUB_PASSWORD" != "true" ] || [ "$HAS_SUPABASE_ACCESS_TOKEN" != "true" ] || [ "$HAS_SUPABASE_PROJECT_ID" != "true" ]; then
            echo "::error::Add T2HUB_EMAIL, T2HUB_PASSWORD, SUPABASE_ACCESS_TOKEN, and SUPABASE_PROJECT_ID under repository Actions secrets."
            exit 1
          fi
          if [ "$HAS_TAKAMOL_LIVE_API_URL" != "true" ] || [ "$HAS_TAKAMOL_ENCRYPTION_KEY_B64" != "true" ] || [ "$HAS_TAKAMOL_SESSION_COOKIE" != "true" ] || [ "$HAS_TAKAMOL_XSRF_TOKEN" != "true" ]; then
            echo "::warning::Optional live-proxy secrets (TAKAMOL_LIVE_API_URL, TAKAMOL_ENCRYPTION_KEY_B64, TAKAMOL_SESSION_COOKIE, TAKAMOL_XSRF_TOKEN) are not all set. The core auto-login session refresh will still run; the takamol-proxy publish step is skipped."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Authenticate Supabase CLI
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase login --token "$SUPABASE_ACCESS_TOKEN" --name t2hub-session-refresh

      - name: Refresh and publish T2Hub session
        env:
          T2HUB_EMAIL: ${{ secrets.T2HUB_EMAIL }}
          T2HUB_PASSWORD: ${{ secrets.T2HUB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/auto-setup-t2hub.mjs

      - name: Publish Takamol live proxy secrets
        if: env.HAS_TAKAMOL_LIVE_API_URL == 'true' && env.HAS_TAKAMOL_ENCRYPTION_KEY_B64 == 'true' && env.HAS_TAKAMOL_SESSION_COOKIE == 'true' && env.HAS_TAKAMOL_XSRF_TOKEN == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          TAKAMOL_LIVE_API_URL: ${{ secrets.TAKAMOL_LIVE_API_URL }}
          TAKAMOL_ENCRYPTION_KEY_B64: ${{ secrets.TAKAMOL_ENCRYPTION_KEY_B64 }}
          TAKAMOL_SESSION_COOKIE: ${{ secrets.TAKAMOL_SESSION_COOKIE }}
          TAKAMOL_XSRF_TOKEN: ${{ secrets.TAKAMOL_XSRF_TOKEN }}
        run: |
          mkdir -p .secrets
          cat > .secrets/takamol.env <<EOF
          TAKAMOL_LIVE_API_URL=${TAKAMOL_LIVE_API_URL}
          TAKAMOL_ENCRYPTION_KEY_B64=${TAKAMOL_ENCRYPTION_KEY_B64}
          TAKAMOL_SESSION_COOKIE=${TAKAMOL_SESSION_COOKIE}
          TAKAMOL_XSRF_TOKEN=${TAKAMOL_XSRF_TOKEN}
          EOF
          npx --yes supabase secrets set --env-file .secrets/takamol.env --project-ref "$SUPABASE_PROJECT_ID"
